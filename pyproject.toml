[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "patchtrace"
version = "0.1.0"
description = "Compare binaries. Trace fixes. Investigate flaws."
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "pydantic==2.13.5", "protobuf==7.36.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.12", "pyinstaller==6.22.3", "hypothesis>=6.100", "networkx>=3.3,<4"]  # networkx: test oracle only (WB2), never a runtime dependency
# Program E optional features (B-0). Every import is guarded by patchtrace.optional_deps; wheels only.
workbench = ["rapidfuzz>=3.9,<4", "pygments>=2.18,<3", "pefile>=2024.8.26"]
rules = ["yara-x>=1.0,<2"]
# Optional cross-check of the in-repo stdlib fitter (decision O5); never imported at runtime or frozen.
calibration-dev = ["scikit-learn>=1.5"]
[project.scripts]
patchtrace = "patchtrace.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_bindiff: real BinDiff acceptance (SPEC-29); records passed/failed/blocked, never skips silently",
]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
