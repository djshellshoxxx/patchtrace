[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "patchtrace"
version = "0.1.0"
description = "Compare binaries. Trace fixes. Investigate flaws."
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "pydantic==2.13.5", "protobuf==7.36.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.12", "pyinstaller==6.22.3", "hypothesis>=6.100"]
[project.scripts]
patchtrace = "patchtrace.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
