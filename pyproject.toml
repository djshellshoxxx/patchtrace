[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "patchtrace"
version = "0.1.0"
description = "Compare binaries. Trace fixes. Investigate flaws."
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "shiboken6==6.12.0", "pydantic==2.13.5", "protobuf==7.36.2"]
[project.optional-dependencies]
# Exact pins (the versions a clean install resolved on 2026-10-30) so a QA run is reproducible; bump deliberately.
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "ruff==0.17.3", "pyinstaller==6.22.3", "hypothesis==6.170.13", "networkx==3.7",
       "pefile==2024.8.26", "pygments==2.21.0"]  # networkx, pefile, pygments: test oracles only, never runtime (WB2/WBQ)
# Program E optional features (B-0). Every import is guarded by patchtrace.optional_deps; wheels only.
search = ["rapidfuzz==3.14.6"]
rules = ["yara-x==1.21.0", "iced-x86==1.21.0"]
# Optional cross-check of the in-repo stdlib fitter (decision O5); never imported at runtime or frozen.
calibration-dev = ["scikit-learn>=1.5,<2"]
[project.scripts]
patchtrace = "patchtrace.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_bindiff: real BinDiff acceptance (SPEC-29); records passed/failed/blocked, never skips silently",
]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
