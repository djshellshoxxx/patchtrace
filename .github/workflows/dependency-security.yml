name: Dependency and static-security qualification
on:
  push:
    branches: [main, 'codex/**']
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Preserve committed bytes on both native runners for the source receipt.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  SCAN_HEAD: ${{ github.sha }}
  SCAN_REPOSITORY: ${{ github.repository }}
jobs:
  dependency-audit:
    name: dependency-audit (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [runtime, packaging]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SCAN_PROFILE: ${{ matrix.profile }}
      SCAN_PLATFORM: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit installed dependencies
        shell: bash
        run: |
          python -m tools.dependency_security audit --out build/dependency-security --profile "$SCAN_PROFILE" --platform "$SCAN_PLATFORM" --head "$SCAN_HEAD" --repository "$SCAN_REPOSITORY"
          python -m tools.dependency_security validate --out build/dependency-security --profile "$SCAN_PROFILE" --platform "$SCAN_PLATFORM" --head "$SCAN_HEAD" --repository "$SCAN_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-security-${{ matrix.os }}-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/dependency-security/*.json
            build/dependency-security/*.stdout
            build/dependency-security/*.stderr
            build/dependency-security/*.txt
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Static security scan
        shell: bash
        run: |
          python -m tools.dependency_security static --out build/security-static --profile static --platform ubuntu-latest --head "$SCAN_HEAD" --repository "$SCAN_REPOSITORY"
          python -m tools.dependency_security validate --out build/security-static --profile static --platform ubuntu-latest --head "$SCAN_HEAD" --repository "$SCAN_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-static-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/security-static/*.json
            build/security-static/*.stdout
            build/security-static/*.stderr
