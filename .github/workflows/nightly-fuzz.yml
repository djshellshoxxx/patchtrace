name: Nightly fuzz (non-gating)
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Fuzz duration in seconds'
        default: '900'
permissions:
  contents: read
jobs:
  fuzz:
    # Linux-only: atheris does not support Windows, so Windows relies on the hypothesis tests (SPEC-10b section 10.2).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: -e '.[dev]'"
      - run: python tools/check_protobuf_runtime.py
      - name: Fuzz inspect_bytes (seeded mutation loop; findings are saved under build/fuzz-crashes)
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '900' }}
        run: |
          case "$FUZZ_SECONDS" in ''|*[!0-9]*) echo "seconds must be an integer"; exit 2;; esac
          python tools/fuzz_binexport.py --seconds "$FUZZ_SECONDS" --crashes build/fuzz-crashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binexport-fuzz-crashes
          path: build/fuzz-crashes
          if-no-files-found: ignore
  parsers:
    # Every untrusted-input parser (tools/fuzz_parsers.py): Ghidriff JSON, CSAF/CVRF/KB import, KEV, Winbindex,
    # capa, FLOSS, DiE and the strict JSON loader. Seeds are hermetic test fixtures; the day-of-year seed varies
    # the corpus between nights while each night stays reproducible from its seed.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: -e '.[dev]'"
      - name: Fuzz every untrusted-input parser (findings saved under build/parser-fuzz-crashes)
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '900' }}
        run: |
          case "$FUZZ_SECONDS" in ''|*[!0-9]*) echo "seconds must be an integer"; exit 2;; esac
          python tools/fuzz_parsers.py --target all --iterations 1000000 --seed "$(date +%j)" --time-budget "$FUZZ_SECONDS" --crash-dir build/parser-fuzz-crashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: parser-fuzz-crashes
          path: build/parser-fuzz-crashes
          if-no-files-found: ignore
