name: QA and Windows standalone
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=qa-results.xml
      - run: python -m ruff check src tests tools
      - if: runner.os == 'Windows'
        run: python tools/build_windows.py
      # SRC-2/SRC-5: release builds come from a clean checkout of exactly $GITHUB_SHA.
      - if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, pathlib
          path = pathlib.Path('dist/PatchTrace/_internal/patchtrace/build-info.json')
          info = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps(info, indent=2))
          assert info['dirty'] is False, 'dirty build rejected'
          assert info['git_commit'] == os.environ['GITHUB_SHA'], (info['git_commit'], os.environ['GITHUB_SHA'])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ runner.os }}
          path: qa-results.xml
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: PatchTrace-windows-x64
          if-no-files-found: error
          path: |
            dist/PatchTrace-*-windows-x64.zip
            dist/PatchTrace-*-windows-x64.zip.sha256
            dist/PatchTrace-*-source.zip
            dist/PatchTrace-*-source.zip.sha256
            dist/SOURCE.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatchTrace-windows-x64
          path: release
      # T-P04: binary ZIP, source ZIP, both .sha256 files and SOURCE.txt must be attached.
      - run: |
          ls -l release
          for pattern in 'PatchTrace-*-windows-x64.zip' 'PatchTrace-*-windows-x64.zip.sha256' \
                         'PatchTrace-*-source.zip' 'PatchTrace-*-source.zip.sha256' 'SOURCE.txt'; do
            compgen -G "release/$pattern" > /dev/null || { echo "missing release asset: $pattern"; exit 1; }
          done
          cd release && sha256sum -c ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-beta.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: PatchTrace Windows beta ${{ github.run_number }}
          body: |
            Windows x64 desktop package. Extract the entire ZIP before launching PatchTrace.exe.
            Python and Qt are bundled. Native binary comparison needs separately configured Ghidra, Java and Ghidriff.
            The included synthetic sample works without an analysis backend or AI provider.
            See docs/qa.md for the exact checks performed and unverified acceptance gates.
            Source for this exact commit: the -source.zip asset (git archive) with its SHA-256. SOURCE.txt names the commit and build commands.
          files: release/*
