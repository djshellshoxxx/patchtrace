name: QA and Windows standalone
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=qa-results.xml
      - run: python -m ruff check src tests tools
      - if: runner.os == 'Windows'
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ runner.os }}
          path: qa-results.xml
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: PatchTrace-windows-x64
          path: |
            dist/PatchTrace-0.1.0-windows-x64.zip
            dist/PatchTrace-0.1.0-windows-x64.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatchTrace-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: PatchTrace ${{ github.ref_name }} beta
          body: |
            Windows x64 desktop package. Extract the entire ZIP before launching PatchTrace.exe.
            Python and Qt are bundled. Native binary comparison needs separately configured Ghidra, Java and Ghidriff.
            The included synthetic sample works without an analysis backend or AI provider.
            See docs/qa.md for the exact checks performed and unverified acceptance gates.
          files: release/*
