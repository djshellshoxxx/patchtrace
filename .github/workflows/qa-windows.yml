name: QA and Windows standalone
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: "python -m pip install --only-binary=:all: -e '.[dev,search,rules]'"
      - run: python -m pip check
      - name: protobuf equals the pin and runs the upb backend (SPEC-10b)
        run: python tools/check_protobuf_runtime.py
      - run: python -m pytest -q --junitxml=qa-results.xml
      - run: python -m ruff check src tests tools
      - name: BinExport worker memory cap measurement (SPEC-10b U7, non-gating)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/qa_binexport_memcap.py --caps 64,96,112,128,256
          python tools/qa_binexport_memcap.py --alloc --caps 128,256
      - if: runner.os == 'Windows'
        run: python tools/build_windows.py
      - name: Frozen EXE headless smoke (A1-A4) and self-test
        if: runner.os == 'Windows'
        run: python tools/frozen_smoke.py dist/PatchTrace/PatchTrace.exe
      - name: Record this matrix leg's own result for the release notes
        if: always()
        shell: bash
        run: echo "${{ job.status }}" > qa-leg-result.txt
      - name: Extract and run portable Windows ZIP outside checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_windows_portable.ps1
      - name: Install pinned NSIS compiler
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.13 --yes --no-progress
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        run: python tools/package_windows_installer.py
      - name: Install, launch, and uninstall the setup package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ runner.os }}
          path: |
            qa-results.xml
            qa-leg-result.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: PatchTrace-windows-x64
          path: |
            dist/PatchTrace-0.1.0-windows-x64.zip
            dist/PatchTrace-0.1.0-windows-x64.zip.sha256
            dist/PatchTrace-Windows-x64-Setup.exe
            dist/PatchTrace-Windows-x64-Setup.exe.sha256
  # Repeats the GUI test files in one pytest session to expose teardown aborts and thread leaks (GUI plan 8.8).
  qt-gate:
    strategy:
      fail-fast: false
      matrix:
        # One pass of the GUI files takes about 5 minutes on a runner, so 20 repeats of all of them overrun any sane
        # timeout; the Linux repeat count stays 20 but the files are dealt over four legs.
        include:
          - os: ubuntu-latest
            repeat: 20
            shard: 1/4
          - os: ubuntu-latest
            repeat: 20
            shard: 2/4
          - os: ubuntu-latest
            repeat: 20
            shard: 3/4
          - os: ubuntu-latest
            repeat: 20
            shard: 4/4
          - os: windows-latest
            repeat: 5
            shard: 1/1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: "python -m pip install --only-binary=:all: -e '.[dev,search,rules]'"
      - run: python tools/qt_gate.py --repeat ${{ matrix.repeat }} --shard ${{ matrix.shard }}
  linux-package:
    needs: qa
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 xvfb
      - run: "python -m pip install --only-binary=:all: -e '.[dev,search,rules]'"
      - run: python tools/check_protobuf_runtime.py
      - run: python tools/build_linux.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: PatchTrace-linux-x86_64
          path: |
            dist/PatchTrace-0.1.0-linux-x86_64.tar.gz
            dist/PatchTrace-0.1.0-linux-x86_64.tar.gz.sha256
  linux-smoke:
    needs: linux-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatchTrace-linux-x86_64
      - run: >-
          sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libfontconfig1 libdbus-1-3
          libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 xvfb
      - run: sha256sum -c PatchTrace-0.1.0-linux-x86_64.tar.gz.sha256
      - run: tar xzf PatchTrace-0.1.0-linux-x86_64.tar.gz && test -x PatchTrace/PatchTrace
      - name: Report unresolved shared libraries of bundled Qt platform plugins
        run: |
          for lib in PatchTrace/_internal/PySide6/Qt/plugins/platforms/*.so PatchTrace/_internal/PySide6/Qt/lib/libQt6XcbQpa.so.6; do
            missing=$(ldd "$lib" | grep 'not found' || true)
            if [ -n "$missing" ]; then echo "::warning::$lib: $missing"; fi
          done
      - run: QT_QPA_PLATFORM=offscreen PatchTrace/PatchTrace --self-test
        env:
          LANG: C.UTF-8
      - run: QT_QPA_PLATFORM=xcb xvfb-run -a PatchTrace/PatchTrace --self-test
        env:
          LANG: C.UTF-8
  # Decides whether this push publishes a prerelease (tools/release_gate.py): every third counted merge, a v* tag, a
  # release marker in the head commit message, or no earlier prerelease. It fails open and says why in `reason`.
  release-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      milestones: ${{ steps.gate.outputs.milestones }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release gate (every third counted merge)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_gate.py --head "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
  release:
    if: startsWith(github.ref, 'refs/tags/v') || needs.release-gate.outputs.publish == 'true'
    needs: [qa, linux-smoke, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatchTrace-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: PatchTrace-linux-x86_64
          path: release
      - uses: actions/download-artifact@v4
        continue-on-error: true  # evidence text only; never blocks a release
        with:
          pattern: qa-*
          path: qa-results
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: src-tree
          persist-credentials: false
      - name: Verify Windows portable hash and add canonical Portable.zip release asset
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c PatchTrace-0.1.0-windows-x64.zip.sha256
          sha256sum -c PatchTrace-Windows-x64-Setup.exe.sha256
          cp PatchTrace-0.1.0-windows-x64.zip PatchTrace-Windows-x64-Portable.zip
          sha256sum PatchTrace-Windows-x64-Portable.zip > PatchTrace-Windows-x64-Portable.zip.sha256
          sha256sum -c PatchTrace-Windows-x64-Portable.zip.sha256
      # Evidence text only: no token use, no change to which jobs gate this one. Falls back to the static
      # preamble if generation fails, so a notes problem can never block or fake a release.
      - name: Generate release notes
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-beta.{0}', github.run_number) }}
          REF_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_RESULT: ${{ needs.qa.result }}
          SMOKE_RESULT: ${{ needs.linux-smoke.result }}
          GATE_MILESTONES: ${{ needs.release-gate.outputs.milestones }}
          GATE_REASON: ${{ needs.release-gate.outputs.reason }}
        run: |
          # Each matrix leg uploads its own status; the aggregate is only the fallback when a file is missing.
          QA_LINUX=$(tr -d '[:space:]' < qa-results/qa-Linux/qa-leg-result.txt 2>/dev/null || true)
          QA_WINDOWS=$(tr -d '[:space:]' < qa-results/qa-Windows/qa-leg-result.txt 2>/dev/null || true)
          QA_LINUX=${QA_LINUX:-$QA_RESULT}
          QA_WINDOWS=${QA_WINDOWS:-$QA_RESULT}
          cat > "$RUNNER_TEMP/preamble.md" <<'EOF'
          Windows x64 desktop package. Run the per-user Setup.exe installer or extract the portable ZIP before launching PatchTrace.exe.
          Linux x86-64 package (built on Ubuntu 22.04; smoke-tested on 22.04 and 24.04). Extract the tar.gz and run PatchTrace/PatchTrace.
          Linux X11 hosts need libegl1, libgl1, libfontconfig1, libxkbcommon-x11-0 and the Qt xcb libraries (libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libxcb-xkb1); see docs/linux.md.
          Python and Qt are bundled. Native binary comparison needs separately configured Ghidra, Java and Ghidriff.
          The included synthetic sample works without an analysis backend or AI provider.
          See docs/qa.md for the exact checks performed and unverified acceptance gates.
          EOF
          printf 'Release gate: %s. Counted merges since the previous prerelease: %s.\n' "$GATE_REASON" "$GATE_MILESTONES" >> "$RUNNER_TEMP/preamble.md"
          python3 src-tree/tools/milestone_notes.py --tag "$TAG" --sha "$GITHUB_SHA" --ref-kind "$REF_KIND" \
            --run-url "$RUN_URL" --run-number "$GITHUB_RUN_NUMBER" --assets release \
            --junit linux=qa-results/qa-Linux/qa-results.xml --junit windows=qa-results/qa-Windows/qa-results.xml \
            --result "qa-ubuntu=$QA_LINUX" --result "qa-windows=$QA_WINDOWS" --result "linux-smoke=$SMOKE_RESULT" \
            --preamble "$RUNNER_TEMP/preamble.md" --output "$RUNNER_TEMP/notes.md" \
            || { echo "::warning::milestone_notes failed; using static preamble only"; cp "$RUNNER_TEMP/preamble.md" "$RUNNER_TEMP/notes.md"; }
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-beta.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: PatchTrace beta ${{ github.run_number }} (Windows x64, Linux x86-64)
          body_path: ${{ runner.temp }}/notes.md
          files: release/*
