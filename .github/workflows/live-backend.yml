name: Native Windows Ghidriff acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tools/live_backend_check.py', 'tools/seed_symbol_cache.py', 'tests/fixtures/**', '.github/workflows/live-backend.yml']
  pull_request:
    paths: ['src/**', 'tools/live_backend_check.py', 'tools/seed_symbol_cache.py', 'tests/fixtures/**', '.github/workflows/live-backend.yml']
permissions:
  contents: read
jobs:
  native:
    # Separate jobs per hypothesis: job names/conclusions are visible without log access.
    name: native (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [repro-plain-ghidriff, patchtrace-clean, patchtrace-seeded-store, patchtrace-seeded-store-no-adjacent-pdb]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: cmd
        run: |
          cl /nologo /LD /Od /GS- /Zi tests\fixtures\old.c /Fdtests\fixtures\ /link /DEBUG /INCREMENTAL:NO /OUT:tests\fixtures\old.dll /PDB:tests\fixtures\old.pdb
          cl /nologo /LD /Od /GS- /Zi tests\fixtures\new.c /Fdtests\fixtures\ /link /DEBUG /INCREMENTAL:NO /OUT:tests\fixtures\new.dll /PDB:tests\fixtures\new.pdb
      - shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip' -OutFile ghidra.zip
          if ((Get-FileHash ghidra.zip -Algorithm SHA256).Hash.ToLower() -ne 'c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120') { throw 'Ghidra archive digest mismatch' }
          Expand-Archive ghidra.zip -DestinationPath ghidra-runtime
          $ghidra = (Get-ChildItem ghidra-runtime -Directory | Select-Object -First 1).FullName
          "GHIDRA_INSTALL_DIR=$ghidra" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m pip install -e . 'ghidriff @ git+https://github.com/clearbluejar/ghidriff.git@4f5d895fcbb1eacd65efd81145922c15bb7e741d'
      - name: Persist a symbol store in global Ghidra preferences (symbol-enabled plain Ghidriff run)
        if: matrix.variant != 'patchtrace-clean'
        shell: pwsh
        run: |
          $fx = "$PWD\tests\fixtures"
          New-Item -ItemType Directory -Force C:\gout, C:\gsym | Out-Null
          Copy-Item "$fx\old.dll","$fx\new.dll" C:\gsym\
          python tools/seed_symbol_cache.py C:\gout\symbols "$fx\old.dll" "$fx\new.dll"
          python -m ghidriff C:\gsym\old.dll C:\gsym\new.dll --output-path C:\gout 2>&1 | Select-Object -Last 15
          $global:LASTEXITCODE = 0
      - name: Reproduce cached-PDB FileExistsError with plain Ghidriff --no-symbols
        if: matrix.variant == 'repro-plain-ghidriff'
        shell: pwsh
        run: |
          python -m ghidriff C:\gsym\old.dll C:\gsym\new.dll --output-path C:\gout2 --no-symbols *> repro.log
          $code = $LASTEXITCODE
          Get-Content repro.log -Tail 25
          if ($code -eq 0 -or -not (Select-String -Path repro.log -SimpleMatch 'symbol is already downloaded' -Quiet)) {
            throw "Native reproduction of cached-PDB failure did not occur (exit $code)"
          }
          $global:LASTEXITCODE = 0
      - name: Remove PDBs at the path embedded in the fixture DLLs
        if: matrix.variant == 'patchtrace-seeded-store-no-adjacent-pdb'
        shell: pwsh
        run: Remove-Item tests\fixtures\old.pdb, tests\fixtures\new.pdb
      - name: PatchTrace offline analysis succeeds despite persisted symbol store
        if: matrix.variant != 'repro-plain-ghidriff'
        run: python tools/live_backend_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-static-acceptance-${{ matrix.variant }}
          if-no-files-found: ignore
          path: |
            live-project/runs/
            live-project/project.sqlite3
