name: Native Windows Ghidriff acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tools/live_backend_check.py', 'tools/live_cache_check.py', 'tools/seed_symbol_cache.py', 'tests/fixtures/**', '.github/workflows/live-backend.yml']
  pull_request:
    paths: ['src/**', 'tools/live_backend_check.py', 'tools/live_cache_check.py', 'tools/seed_symbol_cache.py', 'tests/fixtures/**', '.github/workflows/live-backend.yml']
permissions:
  contents: read
env:
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
  GHIDRA_SHA256: c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Separate jobs per hypothesis: job names/conclusions are visible without log access.
    name: native (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [repro-plain-ghidriff, patchtrace-clean, patchtrace-seeded-store, patchtrace-seeded-store-no-adjacent-pdb, raw-cache-hit]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - shell: cmd
        run: |
          cl /nologo /LD /Od /GS- /Zi tests\fixtures\old.c /Fdtests\fixtures\ /link /DEBUG /INCREMENTAL:NO /OUT:tests\fixtures\old.dll /PDB:tests\fixtures\old.pdb
          cl /nologo /LD /Od /GS- /Zi tests\fixtures\new.c /Fdtests\fixtures\ /link /DEBUG /INCREMENTAL:NO /OUT:tests\fixtures\new.dll /PDB:tests\fixtures\new.pdb
      # Retain the original archive, never the extracted runtime. A cache hit
      # still passes the source-reviewed digest check before fresh extraction.
      - name: Restore pinned Ghidra archive
        id: ghidra-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ghidra-archive
          key: ghidra-archive-v1-${{ env.GHIDRA_SHA256 }}
      - name: Install pinned Ghidra (verify archive before fresh extraction)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GHIDRA_SHA256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'Missing or malformed pinned Ghidra SHA-256' }
          $archive = 'ghidra-archive/ghidra.zip'
          New-Item -ItemType Directory -Force ghidra-archive | Out-Null
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            Invoke-WebRequest $env:GHIDRA_URL -OutFile $archive
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GHIDRA_SHA256) { throw 'Ghidra archive digest mismatch' }
          Write-Host "Verified Ghidra archive SHA-256: $archive ($env:GHIDRA_SHA256)"
          if (Test-Path -LiteralPath ghidra-runtime) {
            Remove-Item -LiteralPath ghidra-runtime -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath ghidra-runtime
          $ghidra = (Get-ChildItem ghidra-runtime -Directory | Select-Object -First 1).FullName
          "GHIDRA_INSTALL_DIR=$ghidra" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m pip install -e . 'ghidriff @ git+https://github.com/clearbluejar/ghidriff.git@4f5d895fcbb1eacd65efd81145922c15bb7e741d'
      - name: Persist a symbol store in global Ghidra preferences (symbol-enabled plain Ghidriff run)
        if: matrix.variant != 'patchtrace-clean' && matrix.variant != 'raw-cache-hit'
        shell: pwsh
        run: |
          $fx = "$PWD\tests\fixtures"
          New-Item -ItemType Directory -Force C:\gout, C:\gsym | Out-Null
          Copy-Item "$fx\old.dll","$fx\new.dll" C:\gsym\
          python tools/seed_symbol_cache.py C:\gout\symbols "$fx\old.dll" "$fx\new.dll"
          python -m ghidriff C:\gsym\old.dll C:\gsym\new.dll --output-path C:\gout 2>&1 | Select-Object -Last 15
          $global:LASTEXITCODE = 0
      - name: Reproduce cached-PDB FileExistsError with plain Ghidriff --no-symbols
        if: matrix.variant == 'repro-plain-ghidriff'
        shell: pwsh
        run: |
          python -m ghidriff C:\gsym\old.dll C:\gsym\new.dll --output-path C:\gout2 --no-symbols *> repro.log
          $code = $LASTEXITCODE
          Get-Content repro.log -Tail 25
          if ($code -eq 0 -or -not (Select-String -Path repro.log -SimpleMatch 'symbol is already downloaded' -Quiet)) {
            throw "Native reproduction of cached-PDB failure did not occur (exit $code)"
          }
          $global:LASTEXITCODE = 0
      - name: Remove PDBs at the path embedded in the fixture DLLs
        if: matrix.variant == 'patchtrace-seeded-store-no-adjacent-pdb'
        shell: pwsh
        run: Remove-Item tests\fixtures\old.pdb, tests\fixtures\new.pdb
      - name: Native raw-output cache hit is byte-identical
        if: matrix.variant == 'raw-cache-hit'
        run: python tools/live_cache_check.py --diagnostics-dir live-cache-diagnostics
      - name: PatchTrace offline analysis succeeds despite persisted symbol store
        if: matrix.variant != 'repro-plain-ghidriff' && matrix.variant != 'raw-cache-hit'
        run: python tools/live_backend_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-static-acceptance-${{ matrix.variant }}
          if-no-files-found: ignore
          path: |
            live-project/runs/
            live-project/project.sqlite3
            live-cache-diagnostics/*.json
