name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the site build tools (never the app dependencies)
        run: python -m pip install --only-binary=:all: -r tools/site/requirements.txt pytest
      - name: Site tests (links, alt text, privacy allow-list, address validator, logo, QR)
        run: python -m pytest -q tests/test_site_*.py
      - name: Build the site into site/dist
        run: python tools/site/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
