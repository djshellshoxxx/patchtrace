name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the site build tools (never the app dependencies)
        run: "python -m pip install --require-hashes --only-binary=:all: -r tools/site/requirements-ci.lock"
      - name: Site tests (links, alt text, privacy allow-list, address validator, logo, QR)
        run: python -m pytest --noconftest --disable-plugin-autoload -q tests/test_site_*.py
      - name: Build the site into site/dist
        run: python tools/site/build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]')
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist
  deploy:
    needs: build
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
