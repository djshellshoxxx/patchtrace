name: Corpus Tier R (sharded)
# SPEC-32 s13. Heavy known-answer corpus work (compilers, pinned rizin, optional Ghidra/Ghidriff) runs here, not in agent
# loops. plan -> matrix of shards -> merge. Artifacts hold labels metadata, feature tables and aggregate metrics only.
# Never uploads images or binaries. Tier W (Microsoft-derived) data is local-only and refused by tools/calibration/tier_r/shard.py.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards (1-256)
        default: '4'
      seed:
        description: Integer seed for deterministic sharding and mutation sites
        default: '1'
      engines:
        description: Comma list of engines (rz-diff, ghidriff, bindiff)
        default: rz-diff
      subset:
        description: smoke, suites, cards, mutations, noise or full
        default: smoke
  schedule:
    # Nightly smoke then noise on the pinned ubuntu-24.04 image; the heavy matrices stay dispatch-only.
    - cron: '17 3 * * *'
    - cron: '47 3 * * *'
  push:
    branches: [main]
    paths: ['tools/calibration/**', 'corpus/ours/**', '.github/workflows/corpus-tier-r.yml']
  pull_request:
    paths: ['tools/calibration/**', 'corpus/ours/**', '.github/workflows/corpus-tier-r.yml']
permissions:
  contents: read
env:
  RIZIN_VERSION: '0.9.1'
  RIZIN_ASSET: rizin-v0.9.1-static-x86_64.tar.xz
  # Same pin and digest as live-rizin.yml (computed by streaming the official asset; not an upstream-published digest).
  RIZIN_SHA256: 9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
  GHIDRA_SHA256: c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120
  GHIDRIFF_PIN: 'ghidriff @ git+https://github.com/clearbluejar/ghidriff.git@4f5d895fcbb1eacd65efd81145922c15bb7e741d'
  SHARDS: ${{ inputs.shards || '2' }}
  SEED: ${{ inputs.seed || '1' }}
  ENGINES: ${{ inputs.engines || 'rz-diff' }}
  SUBSET: ${{ inputs.subset || (github.event.schedule == '47 3 * * *' && 'noise') || 'smoke' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Emit shard matrix
        id: plan
        run: >-
          python -m tools.calibration.tier_r.shard plan
          --seed "$SEED" --shards "$SHARDS" --engines "$ENGINES" --subset "$SUBSET" --plan-out plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-r-plan
          path: plan.json
          if-no-files-found: error
  shard:
    name: shard ${{ matrix.shard }} of ${{ matrix.of }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARD_CASES: ${{ toJSON(matrix.cases) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install compilers (mingw-w64, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 llvm lld clang
      - name: Restore pinned rizin
        id: rizin-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .engine-archives/rizin.tar.xz
          key: rizin-archive-v1-${{ env.RIZIN_SHA256 }}
      - name: Install pinned rizin (fail closed on missing or mismatched SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RIZIN_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::missing or malformed pinned SHA-256"; exit 1; }
          archive=.engine-archives/rizin.tar.xz
          [[ ! -L "$archive" && ( ! -e "$archive" || -f "$archive" ) ]] || { echo "::error::invalid archive file type"; exit 1; }
          mkdir -p .engine-archives
          if [ ! -f "$archive" ]; then
            curl -fsSL -o "$archive" "https://github.com/rizinorg/rizin/releases/download/v${RIZIN_VERSION}/${RIZIN_ASSET}"
          fi
          printf '%s  %s\n' "$RIZIN_SHA256" "$archive" | sha256sum -c -
          mkdir rizin
          tar -xJf "$archive" -C rizin
      - name: Point at rizin
        run: echo "RZ_DIFF=$PWD/rizin/bin/rz-diff" >> "$GITHUB_ENV"
      - name: Java for Ghidra (only when ghidriff is requested)
        if: contains(env.ENGINES, 'ghidriff')
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore Ghidra
        id: ghidra-cache
        if: contains(env.ENGINES, 'ghidriff')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .engine-archives/ghidra.zip
          key: ghidra-archive-v1-${{ env.GHIDRA_SHA256 }}
      - name: Install Ghidra and Ghidriff (fail closed on digest mismatch)
        if: contains(env.ENGINES, 'ghidriff')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GHIDRA_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::missing or malformed pinned SHA-256"; exit 1; }
          archive=.engine-archives/ghidra.zip
          [[ ! -L "$archive" && ( ! -e "$archive" || -f "$archive" ) ]] || { echo "::error::invalid archive file type"; exit 1; }
          mkdir -p .engine-archives
          if [ ! -f "$archive" ]; then
            curl -fsSL -o "$archive" "$GHIDRA_URL"
          fi
          printf '%s  %s\n' "$GHIDRA_SHA256" "$archive" | sha256sum -c -
          mkdir ghidra-runtime
          unzip -q "$archive" -d ghidra-runtime
          echo "GHIDRA_INSTALL_DIR=$(find "$PWD/ghidra-runtime" -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"
          python -m pip install "$GHIDRIFF_PIN"
      - name: Run shard
        shell: bash
        run: >-
          python -m tools.calibration.tier_r.shard run-shard
          --shard "${{ matrix.shard }}" --of "${{ matrix.of }}" --seed "$SEED" --plan-sha256 "${{ matrix.plan }}"
          --cases "$SHARD_CASES" --engines "$ENGINES" --subset "$SUBSET" --out shard-out --timeout 1800
      - name: Step summary
        if: always()
        shell: bash
        run: |
          { echo "### Tier R shard ${{ matrix.shard }} of ${{ matrix.of }}"; echo '```'; ls -l shard-out 2>/dev/null || echo "no shard file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tier-r-shard-${{ matrix.shard }}
          path: shard-out/shard-*.json
          if-no-files-found: warn
  merge:
    name: merge
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tier-r-shard-*
          path: shards
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tier-r-plan
          path: plan
      - name: Merge (fails on missing, duplicate or foreign shards)
        run: python -m tools.calibration.tier_r.shard merge --in shards --plan plan/plan.json --out merged
      - name: Determinism (second merge of the same shards must give the same report_sha256)
        run: |
          python -m tools.calibration.tier_r.shard merge --in shards --plan plan/plan.json --out merged-again
          python -m tools.calibration.ci_summary determinism merged merged-again
      - name: CI status JSON (never silent, even when the shard set is rejected)
        if: always()
        run: |
          mkdir -p merged
          rc=0
          python -m tools.calibration.ci_summary summarize --shards shards --plan plan/plan.json --out merged/ci-summary.json || rc=$?
          cat merged/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Step summary
        if: always()
        run: |
          if [ -f merged/tier-r-report.md ]; then cat merged/tier-r-report.md >> "$GITHUB_STEP_SUMMARY"; else echo "merge produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tier-r-aggregate
          path: merged/
          if-no-files-found: warn
  windows-advisory:
    # Advisory leg: the runner's LLVM clang and lld-link build freestanding suites; missing tools are BLOCKED, not fatal.
    name: windows advisory (smoke)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Plan and run the smoke subset as one shard
        shell: bash
        run: |
          python -m tools.calibration.tier_r.shard plan --seed "$SEED" --shards 1 --subset smoke --plan-out plan.json
          python -m tools.calibration.tier_r.shard run-shard --plan plan.json --shard 0 --out shard-out --timeout 1200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tier-r-windows-advisory
          path: shard-out/shard-*.json
          if-no-files-found: warn
  msvc-advisory:
    # LBL-08 optional MSVC `cl` leg: dispatch-only and enabled by the repository variable TIER_R_MSVC=1, advisory, pinned
    # windows-2022. The dev-command action exports the Visual Studio environment; the job records the cl version.
    name: msvc cl advisory (windows-2022)
    if: github.event_name == 'workflow_dispatch' && vars.TIER_R_MSVC == '1'
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 45
    env:
      PATCHTRACE_REQUIRE_MSVC: '1'
      PATCHTRACE_LIVE_STATUS_DIR: msvc-status
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -e .[dev]'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0, verified annotated tag
        with:
          arch: x64
      - name: Toolchain report (records the cl version)
        shell: bash
        run: python -m tools.calibration.tier_r toolchain | tee msvc-toolchain.json
      - name: Run the MSVC tests
        shell: bash
        run: python -m pytest tests/test_tier_r_msvc.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tier-r-msvc-advisory
          path: |
            msvc-toolchain.json
            msvc-status/
          if-no-files-found: warn
