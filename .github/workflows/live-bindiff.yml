name: Live BinDiff acceptance
# Real pinned BinDiff 8, not mocked (SPEC-29 section 10). Not a required check until stable for >= 10 runs.
# The tool is downloaded from the upstream release, verified against tools/bindiff_pin.json and extracted
# without installing or executing it. While the pin has no verified URL/size/SHA-256 (see the pin's "gap"),
# provisioning records `blocked` and the job summary says LIVE ACCEPTANCE BLOCKED: it never skips silently.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths: ['src/patchtrace/secondary/bindiff*', 'tools/bindiff_pin.json', 'tools/provision_bindiff.py',
            'tools/check_live_status.py', 'tests/test_live_bindiff.py', '.github/workflows/live-bindiff.yml']
permissions:
  contents: read
jobs:
  live-bindiff:
    name: live BinDiff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pin_os: linux
          - os: windows-latest
            pin_os: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PATCHTRACE_LIVE_STATUS_DIR: ${{ github.workspace }}/build/live-status
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime libraries (the pytest-qt plugin imports Qt even for this non-GUI test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -e .[dev]
      - name: Pin digest for the cache key
        id: pin
        shell: bash
        run: echo "key=$(python -c "import json;a=json.load(open('tools/bindiff_pin.json'))['assets']['${{ matrix.pin_os }}'];print(a['sha256'] or 'unpinned')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.pin.outputs.key != 'unpinned'
        with:
          path: build/bindiff-cache
          key: bindiff-${{ matrix.pin_os }}-${{ steps.pin.outputs.key }}
      - name: Provision pinned BinDiff (download + verify + extract; never executes it)
        shell: bash
        run: python tools/provision_bindiff.py --os ${{ matrix.pin_os }} --github-env "$GITHUB_ENV"
      - name: Live BinDiff tests (records passed / failed / blocked)
        shell: bash
        run: python -m pytest -m live_bindiff -rA tests/test_live_bindiff.py
      - name: Live status summary
        if: always()
        shell: bash
        run: python tools/check_live_status.py --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-bindiff-${{ matrix.pin_os }}
          path: build/live-status/
          if-no-files-found: warn
