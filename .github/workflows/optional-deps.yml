name: Optional dependency wheels probe
on:
  pull_request:
    paths: ['pyproject.toml', 'src/patchtrace/optional_deps.py', '.github/workflows/optional-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: -e '.[search,workbench,rules]'"
      - name: every optional dependency imports
        run: python -c "from patchtrace.optional_deps import summary_line as s; l=s(); print(l); assert 'missing=none' in l"
