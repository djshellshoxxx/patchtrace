# Temporary diagnostic: one capped Windows job per new test module, so a hang is identifiable by job name.
name: Windows per-module diagnostics
on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/diag-windows-tests.yml']
permissions:
  contents: read
jobs:
  module:
    name: win ${{ matrix.module }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        module: [test_acquisition_cli, test_acquisition_delta, test_acquisition_quarantine, test_acquisition_transport,
                 test_acquisition_winbindex, test_cli_secondary, test_nway_graph, test_nway_series,
                 test_secondary_bindiff, test_secondary_binexport, test_secondary_reconcile, test_secondary_rzdiff,
                 test_ui_acquisition, test_ui_profiles, test_raw_cache, test_profiles]
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/${{ matrix.module }}.py
