# Temporary diagnostic: one Windows job per cache test so failing test IDs are visible by job name.
name: Windows per-test diagnostics
on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/diag-windows-tests.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.ids.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - id: ids
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          out = subprocess.run(['python', '-m', 'pytest', '-p', 'no:pytestqt', '--collect-only', '-q', 'tests/test_enrichment_cache.py'],
                               capture_output=True, text=True).stdout
          ids = [line.split('::', 1)[1] for line in out.splitlines() if '::' in line]
          print('tests=' + json.dumps(ids))
          EOF
  test:
    needs: collect
    name: win ${{ matrix.test }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        test: ${{ fromJson(needs.collect.outputs.tests) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q "tests/test_enrichment_cache.py::${{ matrix.test }}"
