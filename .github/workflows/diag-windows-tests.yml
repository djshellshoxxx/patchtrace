# Temporary diagnostic: one Windows job per cache test function (names collected locally).
name: Windows per-test diagnostics
on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/diag-windows-tests.yml']
permissions:
  contents: read
jobs:
  test:
    name: win ${{ matrix.test }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        test: ["test_budget_enforced_on_put", "test_cache_module_has_no_forbidden_imports", "test_cancellation_cleans_up_and_releases_lock", "test_corrupt_entries_quarantined", "test_crash_at_each_promotion_point", "test_disk_full_put_returns_false", "test_each_fingerprint_field_change_misses", "test_foreign_host_or_unreadable_lock_not_stolen", "test_ineligible_fingerprints_refuse_raw", "test_invalid_arguments_raise_config", "test_leased_reader_survives_prune", "test_live_pid_lock_not_stolen", "test_lru_evicts_least_recently_accessed", "test_many_threads_same_key", "test_no_cache_touches_nothing", "test_no_cache_with_refresh_is_config_error", "test_permission_error_put_returns_false", "test_prune_also_cleans_orphan_staging", "test_raw_size_bound", "test_readonly_root_put_returns_false", "test_refresh_bypasses_reads_only_for_selected_stages", "test_root_is_a_file_put_returns_false", "test_roundtrip_and_layout", "test_stale_lock_with_dead_pid_recovered", "test_status_reports_usage", "test_swapped_pair_misses", "test_symlink_escape_refused", "test_symlinked_entry_payload_is_not_served", "test_targeted_invalidation_at_key_level", "test_two_writers_same_key", "test_verify_counts", "test_windows_style_rename_failure_returns_false"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_enrichment_cache.py -k "${{ matrix.test }}"
