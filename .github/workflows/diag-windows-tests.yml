# Temporary diagnostic: one capped Windows job per rz-diff test (hang hunt).
name: Windows per-test diagnostics
on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/diag-windows-tests.yml']
permissions:
  contents: read
jobs:
  test:
    name: win ${{ matrix.test }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        test: ["test_empty_array_is_valid_but_empty", "test_fixture_parses_with_one_sided_records", "test_malformed_output_rejected", "test_parse_version", "test_probe", "test_probe_relative_path_is_unsupported", "test_run_failures", "test_run_uses_argv_list_private_cwd_and_limits", "test_timeout_range", "test_unsupported_capability_refused"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_secondary_rzdiff.py -k "${{ matrix.test }}"
