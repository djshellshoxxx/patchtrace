name: Live unified extraction (SPEC-31 S1)
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['src/patchtrace/unified/extract/**', 'src/patchtrace/unified/ir/**', 'src/patchtrace/backend.py', 'src/patchtrace/jobs.py', 'tools/live_unified_check.py', 'tests/fixtures/old.c', 'tests/fixtures/new.c', 'tests/fixtures/unified/**', '.github/workflows/live-unified.yml']
  pull_request:
    paths: ['src/patchtrace/unified/extract/**', 'src/patchtrace/unified/ir/**', 'src/patchtrace/backend.py', 'src/patchtrace/jobs.py', 'tools/live_unified_check.py', 'tests/fixtures/old.c', 'tests/fixtures/new.c', 'tests/fixtures/unified/**', '.github/workflows/live-unified.yml']
permissions:
  contents: read
env:
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
  GHIDRA_SHA256: c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120
  GHIDRIFF_PIN: 'ghidriff @ git+https://github.com/clearbluejar/ghidriff.git@4f5d895fcbb1eacd65efd81145922c15bb7e741d'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    # Builds the two fixture pairs with MSVC (never executed), runs the real extractor on them, and publishes the
    # DLLs and the results so the Linux job analyses the SAME bytes (content_digest equality across operating systems).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the fixture DLLs with MSVC
        shell: cmd
        run: |
          mkdir fx
          cl /nologo /LD /O2 /GS- tests\fixtures\old.c /Fofx\ci_old.obj /Fefx\ci_old.dll /link /BREPRO /INCREMENTAL:NO
          cl /nologo /LD /O2 /GS- tests\fixtures\new.c /Fofx\ci_new.obj /Fefx\ci_new.dll /link /BREPRO /INCREMENTAL:NO
          cl /nologo /LD /O2 /GS- tests\fixtures\unified\probe_old.c user32.lib kernel32.lib /Fofx\probe_old.obj /Fefx\probe_old.dll /link /BREPRO /INCREMENTAL:NO
          cl /nologo /LD /O2 /GS- tests\fixtures\unified\probe_new.c user32.lib kernel32.lib /Fofx\probe_new.obj /Fefx\probe_new.dll /link /BREPRO /INCREMENTAL:NO
      - name: Install Ghidra 12.0.4 with a pinned digest
        shell: pwsh
        run: |
          Invoke-WebRequest $env:GHIDRA_URL -OutFile ghidra.zip
          if ((Get-FileHash ghidra.zip -Algorithm SHA256).Hash.ToLower() -ne $env:GHIDRA_SHA256) { throw 'Ghidra archive digest mismatch' }
          Expand-Archive ghidra.zip -DestinationPath ghidra-runtime
          $ghidra = (Get-ChildItem ghidra-runtime -Directory | Select-Object -First 1).FullName
          "GHIDRA_INSTALL_DIR=$ghidra" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m pip install -e . "pyghidra==3.0.2" "$env:GHIDRIFF_PIN"
        shell: pwsh
      - name: Live extraction, CI fixture pair
        run: python tools/live_unified_check.py --old fx/ci_old.dll --new fx/ci_new.dll --ghidra-dir "$env:GHIDRA_INSTALL_DIR" --out live-out --tag ci-pair
        shell: pwsh
      - name: Live extraction, probe pair
        run: python tools/live_unified_check.py --old fx/probe_old.dll --new fx/probe_new.dll --ghidra-dir "$env:GHIDRA_INSTALL_DIR" --out live-out --tag probe-pair
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-unified-windows
          if-no-files-found: ignore
          path: |
            fx/*.dll
            live-out/*.json
  linux:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: live-unified-windows
          path: windows
      - name: Install Ghidra 12.0.4 with a pinned digest
        run: |
          curl -fsSL -o ghidra.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  ghidra.zip" | sha256sum -c -
          unzip -q ghidra.zip -d ghidra-runtime
          echo "GHIDRA_INSTALL_DIR=$(echo "$PWD"/ghidra-runtime/*/)" >> "$GITHUB_ENV"
      - run: python -m pip install -e . "pyghidra==3.0.2" "$GHIDRIFF_PIN"
      - name: Live extraction on the Windows-built DLLs, CI fixture pair
        run: python tools/live_unified_check.py --old windows/fx/ci_old.dll --new windows/fx/ci_new.dll --ghidra-dir "$GHIDRA_INSTALL_DIR" --out live-out --tag ci-pair --other-results windows/live-out/live-unified-ci-pair-windows.json
      - name: Live extraction on the Windows-built DLLs, probe pair
        run: python tools/live_unified_check.py --old windows/fx/probe_old.dll --new windows/fx/probe_new.dll --ghidra-dir "$GHIDRA_INSTALL_DIR" --out live-out --tag probe-pair --other-results windows/live-out/live-unified-probe-pair-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-unified-linux
          if-no-files-found: ignore
          path: live-out/*.json
