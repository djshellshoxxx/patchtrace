name: PatchTrace Autonomous Codex Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,19 * * *'

# GitHub Actions and the OpenAI API are billed separately.
# This schedule runs a maximum of two attempts per day, with one agent per run.
permissions: {}

concurrency:
  group: patchtrace-api-codex-autonomous
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Merge previously validated autonomous PRs when eligible
        env:
          GH_TOKEN: ${{ secrets.PATCHTRACE_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq \
            '.[] | select(.head.ref | startswith("codex/cloud-")) | select(.head.repo.full_name == "djshellshoxxx/patchtrace") | select(.user.login == "github-actions[bot]" or .user.login == "djshellshoxxx") | select(.draft == false) | .number' |
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            sha="$(gh pr view "$number" --json headRefOid --jq '.headRefOid')"
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"
            for name in 'qa (ubuntu-latest)' 'qa (windows-latest)' 'SonarCloud Code Analysis' 'CodeRabbit'; do
              result="$(printf '%s' "$checks" | jq -r --arg name "$name" \
                '([.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | .conclusion) // "missing"')"
              if [ "$result" != "success" ]; then
                echo "PR #$number not eligible; $name = $result"
                continue 2
              fi
            done
            # Require every additional reported CI/security job to succeed or be explicitly skipped.
            pending="$(printf '%s' "$checks" | jq '[.check_runs[] | select(.name != "release-gate") | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')"
            if [ "$pending" -ne 0 ]; then
              echo "PR #$number has incomplete or failed checks; not merging."
              continue
            fi
            # Reject a changed PR head between validation and merge.
            gh pr merge "$number" --match-head-commit "$sha" --squash --delete-branch ||
              echo "::warning::PR #$number not yet mergeable under repository policy."
          done

  develop:
    needs: integrate
    outputs:
      has_changes: ${{ steps.package.outputs.has_changes }}
      validation: ${{ steps.validation.outcome }}
      base_sha: ${{ steps.base.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
    if: github.repository == 'djshellshoxxx/patchtrace'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Record trusted base SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check API secret and open automation PR queue
        id: preflight
        env:
          HAS_API_KEY: ${{ secrets.PATCHTRACE_OPENAI_API_KEY != '' }}
          GH_TOKEN: ${{ secrets.PATCHTRACE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::Missing repository secret PATCHTRACE_OPENAI_API_KEY."
            exit 1
          fi
          pending="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq \
            '.[] | select(.head.ref | startswith("codex/cloud-")) | select(.head.repo.full_name == "djshellshoxxx/patchtrace") | select(.user.login == "github-actions[bot]" or .user.login == "djshellshoxxx") | .number' | wc -l)"
          echo "Open Codex cloud PRs: $pending"
          if [ "$pending" -ge 2 ]; then
            echo "Two autonomous PRs are pending; skip new paid agent work until integrated."
            echo "run_agent=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.run_agent == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PatchTrace development dependencies
        if: steps.preflight.outputs.run_agent == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run API-funded Codex on an unowned task
        if: steps.preflight.outputs.run_agent == 'true'
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.PATCHTRACE_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          output-file: codex-report.txt
          prompt: |
            You are the PatchTrace cloud development agent using an API-funded
            short-lived GitHub-hosted runner. Perform one complete, valuable,
            independently testable code change. Do not stop at an inventory.

            Read AGENTS.md, docs/modules.md, relevant specifications and
            current GitHub-linked handoffs. Respect existing feature owners;
            do not duplicate work represented by pending PRs. Review the
            repository's local task records before choosing work. Prioritize
            safe, unowned CVE/KB correlation, binary comparison correctness,
            ingestion, persistence or regression defects.

            The previous test run 41691829253 detected a CVE snapshot
            microsecond-expiry boundary defect, but its changes were discarded.
            If that defect remains on main and is not owned elsewhere, fix it
            with regression tests first. Otherwise select the next unowned,
            clearly scoped task.

            Dependencies are provisioned. Use test-driven development.
            Implement source and test changes, update matching specifications
            when contracts change, execute focused tests, and document honest
            failures. The full QA suite runs in a subsequent workflow step.

            Allowed file areas: src/, tests/, tools/, docs/, and tasks/.
            Never edit .github/, AGENTS.md, pyproject.toml, credentials,
            vendor code, or release/tag metadata in this run.
            Do not execute untrusted target binaries, perform external
            binary acquisition, push commits, merge branches or change
            repository policy. No new product scope. Stay within the
            repository's accepted work and leave a concise final report.

      - name: Prevent unauthorized file publication
        if: steps.preflight.outputs.run_agent == 'true'
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          bad=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              src/*|tests/*|tools/*|docs/*|tasks/*) ;;
              codex-report.txt) ;;
              *)
                echo "::error::Unexpected modified or untracked path: $file"
                bad=1
                ;;
            esac
          done < <({ git diff --name-only "$BASE_SHA" --; git ls-files -o --exclude-standard; } | sort -u)
          exit "$bad"

      - name: Validate PatchTrace source and tests
        if: steps.preflight.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: validation
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests tools
          timeout 900s python -m pytest -q

      - name: Upload Codex run report
        if: always() && steps.preflight.outputs.run_agent == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-report-${{ github.run_id }}
          path: codex-report.txt
          if-no-files-found: ignore
          retention-days: 30


      - name: Package authorized code changes for separate publisher
        if: steps.preflight.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Include authorized changes even if the coding agent made local commits.
          git reset --soft "${{ steps.base.outputs.sha }}"
          git add -A -- src tests tools docs tasks
          if git diff --cached --quiet; then
            echo "No source changes to publish."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > codex-changes.patch
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload approved source patch
        if: steps.package.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-patch-${{ github.run_id }}
          path: codex-changes.patch
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: develop
    if: needs.develop.result == 'success' && needs.develop.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout trusted main for publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Require unchanged validated base
        env:
          EXPECTED_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Main advanced since development; refusing to publish unvalidated patch."
            exit 1
          }

      - name: Download source patch from isolated development job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-patch-${{ github.run_id }}
          path: codex-staging

      - name: Apply patch strictly as data, not executable code
        shell: bash
        run: |
          set -euo pipefail
          test -s codex-staging/codex-changes.patch
          git apply --check --binary -- codex-staging/codex-changes.patch
          git apply --binary -- codex-staging/codex-changes.patch
          git status --short

      - name: Create persistent code review PR
        id: publish
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.PATCHTRACE_GITHUB_TOKEN || github.token }}
          branch: codex/cloud-${{ github.run_id }}
          base: main
          add-paths: |
            src
            tests
            tools
            docs
            tasks
          commit-message: 'fix: preserve autonomous PatchTrace development checkpoint'
          title: 'codex: autonomous PatchTrace checkpoint ${{ github.run_id }}'
          body: |
            Generated by the API-funded PatchTrace autonomous workflow.
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Ruff + offscreen pytest validation outcome: ${{ needs.develop.outputs.validation }}
            Review changes and independent CI evidence before merging.
            The Codex report is attached to the development job.
          draft: ${{ needs.develop.outputs.validation != 'success' }}
          delete-branch: true

      - name: Dispatch cross-platform QA for review branch
        if: steps.publish.outputs.pull-request-branch != '' && needs.develop.outputs.validation == 'success'
        env:
          GH_TOKEN: ${{ secrets.PATCHTRACE_GITHUB_TOKEN || github.token }}
          PR_BRANCH: ${{ steps.publish.outputs.pull-request-branch }}
        run: |
          gh workflow run qa-windows.yml --ref "$PR_BRANCH"
          echo "Dispatched Linux + Windows QA for $PR_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish checkpoint URL
        if: steps.publish.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.publish.outputs.pull-request-url }}
        run: echo "Created or updated $PR_URL" >> "$GITHUB_STEP_SUMMARY"
